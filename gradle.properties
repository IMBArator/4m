org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true

# --- mod identity -----------------------------------------------------------
# modId is NOT 4m, deliberately. Forge validates mod ids against ^[a-z][a-z0-9_]{1,63}$ and throws
# InvalidModFileException on a leading digit, so a mod with id "4m" never loads. Java packages have
# the same restriction. Minecraft resource namespaces do NOT — assets/4m/ is perfectly legal — which
# makes this a trap: everything looks right until FML refuses the jar. mmmm is the four Ms of
# Minecraft Multi Media Mod; the 4M branding lives in modName, which has no such constraint.
modId=mmmm
modName=M&N's Minecraft Multi Media Mod - 4M
modGroup=mmmm
modVersion=0.1.0
modAuthors=
modLicense=GPL-3.0-or-later
modDescription=M&N's Minecraft Multi Media Mod. Synchronised web radio, tunnelled through the server so every player hears the same audio at the same instant.

# --- platform (ADR-0001) ----------------------------------------------------
minecraftVersion=1.20.1
# Forge and NeoForge share the 47.x line; NeoForge 47.1.106 is the fork point.
forgeVersion=47.4.0
neoforgeVersion=47.1.106
parchmentMinecraftVersion=1.20.1
parchmentMappingsVersion=2023.09.03

# --- decoders (ADR-0010) ----------------------------------------------------
# CLIENT SIDE ONLY. The server parses frame headers by hand and needs neither.
jlayerVersion=1.0.1
jaadVersion=0.8.6

# --- test -------------------------------------------------------------------
junitVersion=5.10.2
