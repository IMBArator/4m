plugins {
    id 'net.neoforged.gradle.userdev' version '7.0.145'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

base.archivesName = "${modId}-neoforge-${minecraftVersion}"

// NeoForge 1.20.1 (47.1.x) is the Forge 47.1 fork point, so everything below
// mirrors forge/build.gradle. Kept as two files rather than templated, on
// purpose (ADR-0002) — these are expected to diverge over time.
runs {
    configureEach {
        workingDirectory project.file('run')
        systemProperty 'forge.logging.markers', ''
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    client { }
    server { programArgument '--nogui' }
}

mixin {
    add sourceSets.main, "${modId}.refmap.json"
    config "${modId}.mixins.json"
}

// ADR-0002: same shared source directory as :forge.
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

configurations {
    jarJar
    shade
    implementation.extendsFrom shade
}

dependencies {
    implementation "net.neoforged:forge:${minecraftVersion}-${neoforgeVersion}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation project(':core')

    // ADR-0010: LGPL, nested unmodified.
    jarJar("javazoom:jlayer:${jlayerVersion}") {
        jarJar.ranged(it, "[${jlayerVersion},)")
    }
    implementation "javazoom:jlayer:${jlayerVersion}"

    // ADR-0010: public domain, relocated.
    shade "net.sourceforge.jaadec:jaad:${jaadVersion}"
}

jarJar.enable()

shadowJar {
    configurations = [project.configurations.shade]
    from project(':core').sourceSets.main.output
    relocate 'net.sourceforge.jaad', "${modGroup}.shaded.jaad"
    archiveClassifier = 'shaded'
}

processResources {
    def props = [
            modId: modId, modName: modName, modVersion: modVersion,
            modAuthors: modAuthors, modLicense: modLicense,
            modDescription: modDescription,
            minecraftVersion: minecraftVersion, forgeVersion: neoforgeVersion,
    ]
    inputs.properties props
    filesMatching('META-INF/mods.toml') { expand props }
}
