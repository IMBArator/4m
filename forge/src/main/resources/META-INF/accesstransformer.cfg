# No access transformers yet.
# This file exists because forge/build.gradle sets `accessTransformer = file(...)` unconditionally
# and ForgeGradle fails if the target is missing.
# NOTE: every line must be blank or `# text`. A bare `#` is rejected as an invalid AT line.
# ADR-0007 hooks the sound engine with a Mixin rather than an AT. The AT route is the documented
# fallback there (SoundEngine.channelAccess / .library), so if that fallback is ever taken, the
# entries go here.
