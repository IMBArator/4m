plugins {
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

base.archivesName = "${modId}-forge-${minecraftVersion}"

minecraft {
    mappings channel: 'parchment', version: "${parchmentMappingsVersion}-${parchmentMinecraftVersion}"
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            // :core is a separate Gradle project, not a jar on the classpath, so it has to be
            // declared here as a source of the mod — otherwise the entry class's first touch of a
            // mmmm.core.* class throws NoClassDefFoundError under runClient.
            //
            // This line is also why the produced jar could ship without :core for weeks without
            // anyone noticing: it makes dev runs work by a completely different mechanism than the
            // jar does, so a green runClient says nothing about whether the jar is loadable. The
            // jar's own copy is configured further down; tools/check-server-jar.sh checks it.
            mods {
                "${modId}" {
                    source sourceSets.main
                    source project(':core').sourceSets.main
                }
            }
        }
        client { property 'forge.enabledGameTestNamespaces', modId }

        // A second client, for the measurement the whole project exists for: two listeners on one
        // server, both unmuted, and any offset above ~20 ms audible as phasing (PLAN.md §11).
        //
        // Its own working directory and its own username are both required, not tidiness. Two
        // clients sharing `run` fight over options.txt, the log and the session lock; two clients
        // called "Dev" are one duplicate login, and the server kicks the second.
        // These two usernames are load-bearing beyond the login. run-server/ops.json grants level 4
        // by UUID, and an offline-mode UUID is derived from the name alone —
        // UUID.nameUUIDFromBytes("OfflinePlayer:" + name), an MD5 version-3 UUID — so it is stable
        // everywhere but also case-sensitive and name-specific. Rename a client and its ops entry
        // stops matching; run the server with online-mode=true and both entries go dead, because
        // real Mojang UUIDs apply instead. Either way the failure is silent: you simply are not an
        // operator, and setting a custom station stops working for no visible reason.
        client2 {
            parent minecraft.runs.client
            workingDirectory project.file('run-client2')
            args '--username', 'Dev2'
        }

        // Also its own directory: the dedicated server and a client otherwise interleave into one
        // latest.log, which is precisely the file the sync work is read from.
        server {
            property 'forge.enabledGameTestNamespaces', modId
            args '--nogui'
            workingDirectory project.file('run-server')
        }
    }
}

mixin {
    add sourceSets.main, "${modId}.refmap.json"
    config "${modId}.mixins.json"
}

// ADR-0002: one copy of the Minecraft-but-not-loader code, compiled twice.
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

configurations {
    // ADR-0010: JLayer is LGPL and ships nested and unmodified.
    jarJar
    // ADR-0010: JAADec is public domain and gets relocated.
    shade
    implementation.extendsFrom shade
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraftVersion}-${forgeVersion}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation project(':core')

    jarJar("javazoom:jlayer:${jlayerVersion}") {
        jarJar.ranged(it, "[${jlayerVersion},)")
    }
    implementation "javazoom:jlayer:${jlayerVersion}"

    // TODO(4b): unresolvable coordinates — see the note in core/build.gradle.
    //shade "net.sourceforge.jaadec:jaad:${jaadVersion}"
}

jarJar.enable()

// JLayer must be on the mod's runtime classpath during dev runs. ForgeGradle puts `mods` source
// set OUTPUT on the mod classloader, but not `implementation` library jars — so javazoom.jl.*
// classes are invisible to ClientMediaSession's constructor, and the NoClassDefFoundError is
// silently swallowed by enqueueWork, producing a silent radio with no visible cause.
// Copying the jar's classes into the compile output dir puts them on the mod classloader, which
// ForgeGradle resolves from build/classes/java/main. This is a dev-mode-only workaround, and it is
// only dev-mode-only because `jar` excludes javazoom/** — without that exclusion the classes ride
// along into the shipped jar and quietly defeat ADR-0010's Jar-in-Jar arrangement.
//
// The `from` argument is a closure, not a value, so runtimeClasspath is resolved at execution time
// rather than while this task is being realized. Resolving it eagerly asks ForgeGradle to generate
// the mapped+AT'd Forge artifact from inside dependency resolution, where Gradle's mutation guard
// forbids the tasks MinecraftUserRepo needs to create. That surfaces only as
// "Could not find net.minecraftforge:forge:...mapped_parchment..._at_...", and only on a machine
// whose ForgeGradle cache does not already hold that artifact — so a warm cache hides it entirely.
tasks.register('extractJLayer', Copy) {
    from({ zipTree(configurations.runtimeClasspath.filter { it.name.startsWith('jlayer') }.singleFile) })
    into(layout.buildDirectory.dir('classes/java/main'))
    exclude 'META-INF/**'
}

tasks.named('compileJava') { finalizedBy 'extractJLayer' }
tasks.named('jar') { dependsOn 'extractJLayer' }
tasks.named('jarJar') { dependsOn 'extractJLayer' }

shadowJar {
    configurations = [project.configurations.shade]
    relocate 'net.sourceforge.jaad', "${modGroup}.shaded.jaad"
    archiveClassifier = 'shaded'
}

// Dormant until JAADec has real coordinates (see core/build.gradle). With `shade` empty there is
// nothing left to relocate, so this task would emit a jar that is neither reobfed nor jarJar'd —
// indistinguishable from the real artifact in build/libs, and broken in a way that only shows up
// once someone installs it. An artifact that cannot load must not be produced at all.
tasks.named('shadowJar') { enabled = false }

// `jar` and `jarJar` are two INDEPENDENT Jar tasks. jarJar does not repackage jar's archive — it
// builds from the same source set and is reobfed by its own task (reobfJarJar). So configuring one
// and assuming the other follows produces two artifacts that differ, which is how the shipped jar
// came to be missing :core. They are configured together here so they cannot drift apart again.
[tasks.named('jar'), tasks.named('jarJar')]*.configure {
    // :core is a separate Gradle project: `implementation project(':core')` compiles against it but
    // embeds nothing, so every produced jar threw NoClassDefFoundError: mmmm/core/… on the entry
    // class's first touch — RadioServer builds a SourceOpener during ServerStartingEvent, so a
    // dedicated server died on boot. runClient never showed it because ForgeGradle puts :core's
    // source set on the dev classpath (the `mods` block above), which is why this survived so long.
    //
    // Embedding the classes rather than nesting :core as a jarJar library rests on one fact: :core
    // has no Minecraft references at all (ADR-0002), so reobf has nothing to remap in it and passing
    // it through is a no-op. Nesting would also work, but it would mean publishing :core as a
    // versioned Maven artifact to satisfy jarJar's range metadata, for no gain.
    from project(':core').sourceSets.main.output

    // The extractJLayer workaround above copies JLayer's classes into the compile output so dev runs
    // can see them, and both jars are built from that same directory — so the shipped jar carried 71
    // unrelocated javazoom/** classes *in addition to* the nested jlayer jar. That breaks ADR-0010:
    // the baked-in copy shadows the nested one on the classpath, so JLayer stops being separately
    // replaceable, which is the condition the LGPL bundling arrangement depends on.
    exclude 'javazoom/**'
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : modId,
                'Specification-Vendor'    : modAuthors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : modName,
                'Implementation-Version'  : modVersion,
                'Implementation-Vendor'   : modAuthors,
        ])
    }

    // Not the artifact to install: no nested libraries, so JLayer is missing and MP3 playback dies
    // at the first decode. jarJar's output takes the plain name because that is the one that works.
    archiveClassifier = 'slim'
}

tasks.named('jar') { finalizedBy 'reobfJar' }

// The shippable artifact: the reobfed mod plus its nested libraries. Unclassified so that the jar a
// user reaches for by name is the one that loads.
tasks.named('jarJar') { archiveClassifier = '' }

// Guard rail for the dist split. A dedicated server VERIFIES every class it loads, and verification
// resolves the types an argument is checked against — so a single client type named in the entry
// class is enough for Forge's RuntimeDistCleaner to abort mod construction with
// "Attempted to load class ... for invalid dist DEDICATED_SERVER". That is a crash on boot, and
// runClient cannot produce it, because runClient is a client.
//
// The rule enforced is deliberately blunt: a file that names net.minecraft.client lives in a
// `client` package, nothing else does. Blunter than the real invariant and much easier to keep.
//
// It catches the import-level form only. The subtler form — a lambda whose body mentions a client
// type, compiled into whichever class encloses it — needs an actual dedicated server to catch, which
// is what tools/check-server-jar.sh is for.
tasks.register('checkClientClassesAreClientOnly') {
    group = 'verification'
    description = 'Fails if a non-client package imports net.minecraft.client.'
    def roots = [rootProject.file('common/src/main/java'), file('src/main/java')]
    doLast {
        def offenders = []
        roots.findAll { it.exists() }.each { root ->
            root.eachFileRecurse { f ->
                if (f.name.endsWith('.java') && f.parentFile.name != 'client') {
                    f.eachLine { line ->
                        if (line =~ /^\s*import\s+(static\s+)?net\.minecraft\.client\./) {
                            offenders << "${root.toPath().relativize(f.toPath())}: ${line.trim()}"
                        }
                    }
                }
            }
        }
        if (offenders) {
            throw new GradleException(
                "Only a `client` package may import net.minecraft.client — a dedicated server " +
                "loads everything else and dies on it:\n  " + offenders.join('\n  '))
        }
    }
}

tasks.named('check') { dependsOn 'checkClientClassesAreClientOnly' }

processResources {
    def props = [
            modId: modId, modName: modName, modVersion: modVersion,
            modAuthors: modAuthors, modLicense: modLicense,
            modDescription: modDescription,
            minecraftVersion: minecraftVersion, forgeVersion: forgeVersion,
    ]
    inputs.properties props
    filesMatching('META-INF/mods.toml') { expand props }
}
